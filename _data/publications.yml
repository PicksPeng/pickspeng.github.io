- title: Stateful Governance for Concurrent Agentic Systems
  show: true
  featured: true
  featured_order: 3
  abstract: |-
    AI agents are moving from advisory interfaces into systems that execute
    consequential operations: issuing refunds, reserving scarce inventory,
    provisioning cloud resources, and initiating financial transfers. These
    workflows require governance over effects, not only over model outputs. Existing
    safeguards often decide whether an action is allowed from the information
    available when the action is requested.
    For stateful policies, that request-time view may be incomplete: budgets,
    inventory, approval status, and risk signals can change before the effect occurs,
    making an earlier authorization or approval stale.

    This paper studies stateful governance for concurrent agentic systems. We
    identify stale authorization as the core failure mode and define policy-state
    serializability, a correctness condition requiring committed effects to be
    explainable as authorized against the policy state immediately before they occur.
    We present MasuGate, a runtime architecture that keeps policies as reviewable
    programs while coordinating the state and effects needed to preserve their
    decisions.
    In experiments with a PostgreSQL-backed prototype of MasuGate, the system
    prevents stale authorizations missed by baselines that pass policy state as
    ordinary request context, preserves delayed approvals while unrelated work
    proceeds, keeps policy evolution mostly in policy text rather than trusted
    provider code, and avoids policy violations in a scripted, LLM-free procurement
    workflow where agent-governance baselines produce stale authorizations over
    shared budgets and inventory.
    More broadly, MasuGate suggests a path for integrating stateful governance
    boundaries into agent frameworks and provider-backed domains where agents act on
    shared resources.
  links:
    - label: website
      url: https://masugate.github.io/
    - label: paper
      url: https://arxiv.org/abs/2608.02764
    - label: code
      url: https://github.com/masugate/masugate
  authors: >-
    <u>Yuxiang Peng</u>, Xiaodi Wu
  venue: Manuscript, 2026

